<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#141414" />
    <!-- Ohne das versucht Android/Samsung Internet, die Seite über "Dark mode
         for web contents" automatisch nachzudunkeln – das verfälscht Farben
         (z. B. Gelb wird bräunlich) und hellt Bild-Hintergründe (Hexagon) auf. -->
    <meta name="color-scheme" content="dark" />
    <title>GraveWatcher - MTG Graveyard Tracker</title>
    <meta name="apple-mobile-web-app-title" content="GraveWatcher" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <!-- ?v=N ist Cache-Busting: zwingt zwischengeschaltete Proxys/CDNs (z. B.
         Samsung Internets Datensparmodus), die Datei als "neu" zu behandeln
         und sie nicht aus einem eigenen Server-Cache zu bedienen. Bei jeder
         inhaltlichen Änderung an style.css/app.js muss N hier hochgezählt
         werden (siehe auch die passende Zeile im <script>-Tag unten). -->
    <link rel="stylesheet" href="style.css?v=17" />
  </head>
  <body>
    <div class="app">
      <!-- Bleibt beim Scrollen des Boards oben sichtbar (position: sticky). -->
      <div class="sticky-header">
        <!-- Kopfleiste: Sechseck-Summe | Typ-Übersichtspanel | Hamburger -->
        <header class="topbar">
          <div
            class="total-hex"
            id="totalHex"
            role="button"
            tabindex="0"
            aria-label="Total across all players, tap for full-screen view"
          >
            <span class="total-hex__value" id="totalAll">0</span>
            <span class="total-hex__type-count" id="totalHexTypeCount" title="Distinct card types" hidden
              >0</span
            >
          </div>

          <div
            class="type-panel"
            id="typePanel"
            role="button"
            tabindex="0"
            aria-label="Overview by card type, tap for full-screen view"
          ></div>

          <button
            class="menu-btn"
            id="menuOpenBtn"
            type="button"
            aria-label="Open menu"
            aria-haspopup="true"
          >
            <img src="icons/ui/menu.png" alt="" />
          </button>
        </header>

        <div
          class="player-totals"
          id="playerTotals"
          role="group"
          aria-label="Totals per player"
        ></div>
      </div>

      <!-- Board: pro Kartentyp ein Abschnitt mit zwei Zählern (du / Gegner) -->
      <main class="board" id="board">
        <!-- Schwebende Reset-Steuerung, immer sichtbar: setzt den
             fokussierten Spieler zurück (siehe `selectedPlayer` in app.js),
             ohne Fokus alles. position: fixed nimmt beide Buttons aus dem
             Grid-Layout heraus, sie fressen also keine Kachel. Ein Tipp auf
             den Reset-Button blendet links daneben einen Bestätigen-Button
             ein (✓, grün) und färbt den Reset-Button selbst zum
             Abbrechen-Button um (✕, rot) – explizite Zwei-Tasten-Bestätigung
             statt des fehleranfälligeren "nochmal auf denselben Button
             tippen". -->
        <div class="board-reset-controls" id="boardResetControls">
          <button
            class="board-reset-btn board-reset-btn--confirm"
            id="boardPlayerResetConfirmBtn"
            type="button"
            aria-label="Confirm reset"
            hidden
          >
            ✓
          </button>
          <button class="board-reset-btn" id="boardPlayerResetBtn" type="button" aria-label="Reset">
            <img class="board-reset-btn__icon" src="icons/ui/reset.png" alt="" />
            <span class="board-reset-btn__cancel-icon" hidden>✕</span>
          </button>
        </div>
      </main>
    </div>

    <!-- Seitenmenü von rechts, mit Scrim -->
    <div class="scrim" id="scrim" hidden></div>
    <aside class="side-panel" id="sidePanel" aria-hidden="true" aria-label="Menu">
      <div class="side-panel__header">
        <h2>Menu</h2>
        <button class="icon-btn" id="menuCloseBtn" type="button" aria-label="Close menu">
          <img src="icons/ui/close.png" alt="" />
        </button>
      </div>
      <div class="side-panel__body">
        <div class="player-count-setting">
          <span class="player-count-setting__label">Players</span>
          <div class="player-count-setting__options" role="group" aria-label="Number of players">
            <button type="button" data-player-count="1">1</button>
            <button type="button" data-player-count="2">2</button>
            <button type="button" data-player-count="3">3</button>
            <button type="button" data-player-count="4">4</button>
          </div>
        </div>
        <div class="player-names-setting">
          <span class="player-names-setting__label">Player names</span>
          <div class="player-names-setting__rows" id="playerNamesRows"></div>
        </div>
        <div class="side-panel__divider" id="sidePanelDividerPlayers"></div>
        <button class="side-action" id="wakeLockBtn" type="button" aria-pressed="false">
          <img src="icons/ui/lock.png" alt="" />
          <span>Keep screen on</span>
          <span class="side-action__switch" aria-hidden="true"></span>
        </button>
        <button class="side-action" id="watermarkBtn" type="button" aria-pressed="true">
          <span>Icon watermarks</span>
          <span class="side-action__switch" aria-hidden="true"></span>
        </button>
        <div class="side-panel__divider" id="sidePanelDividerToggles"></div>
        <div class="type-visibility-setting" id="typeVisibilitySetting">
          <span class="type-visibility-setting__label">More types</span>
          <div class="type-visibility-setting__options">
            <label class="type-visibility-option">
              <input type="checkbox" data-optional-type="planeswalker" />
              <span>Planeswalker</span>
            </label>
            <label class="type-visibility-option">
              <input type="checkbox" data-optional-type="battles" />
              <span>Battles</span>
            </label>
          </div>
        </div>
      </div>
    </aside>

    <!-- Vollbildübersicht: öffnet sich per Klick auf die Typ-Übersicht in der Kopfleiste -->
    <div
      class="fullscreen-overview"
      id="categoryOverview"
      role="button"
      tabindex="0"
      aria-label="Close full-screen overview"
      hidden
    >
      <div class="fullscreen-overview__hex">
        <span class="fullscreen-overview__hex-value" id="overviewTotalAll">0</span>
      </div>
      <div class="fullscreen-overview__meta">
        <span class="fullscreen-overview__scope" id="overviewScope" hidden></span>
        <span class="fullscreen-overview__type-count" id="overviewTypeCount">0 types</span>
      </div>
      <div class="fullscreen-overview__grid" id="overviewGrid"></div>
    </div>

    <!-- Toast für kurze Rückmeldungen, optional mit Rückgängig-Button -->
    <div class="toast" id="toast" role="status" aria-live="polite" hidden>
      <span class="toast__message" id="toastMessage"></span>
      <button class="toast__undo" id="toastUndoBtn" type="button" hidden>Undo</button>
    </div>

    <script src="app.js?v=19"></script>
  </body>
</html>
